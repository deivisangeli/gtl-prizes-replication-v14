name: Replicate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  replicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true

      - name: Install system libraries for the R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev \
            libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Restore the R library from renv.lock
        uses: r-lib/actions/setup-renv@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install the Python packages
        run: pip install -r requirements.txt

      - name: Reproduce every table, macro file and figure
        run: Rscript run_all.R

      - name: Check the outputs against the paper and for extraneous files
        run: Rscript tests/test_outputs.R

      - name: Keep the generated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/
